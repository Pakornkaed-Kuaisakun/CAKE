version: '3.8'

services:
  # CAKE Core Backend Server
  cake-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    command: npm run server

  # CAKE Core Web UI
  cake-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://cake-server:8000
    depends_on:
      - cake-server
    volumes:
      - ./web/src:/app/src
      - ./web/node_modules:/app/node_modules
